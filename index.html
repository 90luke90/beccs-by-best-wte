<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BECCS-by-best-WtE | Waste to Energy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- GRUNDDESIGN & RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-family: 'Inter', sans-serif; color: #333; line-height: 1.6; }
        body { display: flex; background-color: #f9fafb; min-height: 100vh; }
        h1, h2, h3 { color: #111; margin-bottom: 15px; }
        p { margin-bottom: 15px; }
        a { color: #0056b3; text-decoration: none; }
        a:hover { text-decoration: underline; }
        hr { margin: 30px 0; border: 0; border-top: 1px solid #ddd; }
        img { max-width: 100%; height: auto; display: block; margin: 20px auto; }
        
        /* --- SIDEBAR NAVIGATION (odwzorowanie oryginału) --- */
        header {
            width: 250px;
            background-color: #555555; /* Ciemnoszary, zbliżony do oryginału */
            color: white;
            padding: 40px 20px;
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1000;
        }
        .logo { font-size: 1.2rem; font-weight: 400; color: white; text-decoration: none; margin-bottom: 80px; display: block;}
        .logo:hover { text-decoration: none; color: #ccc;}
        nav { flex-grow: 1; display: flex; align-items: center; justify-content: center;}
        nav ul { list-style: none; display: flex; flex-direction: column; gap: 20px; text-align: center; width: 100%;}
        nav ul li a { font-weight: 400; color: #ccc; font-size: 0.9rem; transition: color 0.3s; }
        nav ul li a:hover, nav ul li a.active { color: white; text-decoration: none; font-weight: 600;}
        .footer-nav { font-size: 0.75rem; color: #aaa; text-align: center; line-height: 1.8;}
        .footer-nav a { color: #aaa; text-decoration: none;}
        .footer-nav a:hover { color: white; }

        /* --- MAIN CONTENT AREA --- */
        main {
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        /* --- SEKTIONEN --- */
        section { padding: 60px 5%; max-width: 1200px; margin: 0 auto; }
        
        /* --- HERO (Strona główna jak w oryginale) --- */
        .hero-section {
            background-image: url('home.webp'); /* Upewnij się, że plik to home.webp */
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Opcjonalne: efekt paralaksy */
            min-height: 100vh;
            padding: 0;
            display: flex;
            align-items: flex-start;
            padding-top: 80px;
            padding-left: 60px;
        }
        .hero-content {
            max-width: 700px;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7); /* Delikatny cień dla czytelności bez tła */
        }
